name: game-ci
on:
  push:
    paths: ['game/**', '.github/workflows/game-ci.yml']
  pull_request:
    paths: ['game/**', '.github/workflows/game-ci.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: game
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run bot
      - run: npm run build
      - run: npm run size
  golden:
    # R7: replays must hash identically in Node, Chromium, Firefox and WebKit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: game
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game/package-lock.json
      - run: npm ci
      - run: npm install --no-save playwright@1.63.0
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run golden
