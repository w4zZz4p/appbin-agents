<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0e1622" />
    <title>Driftline</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0e1622; }
      body { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; overscroll-behavior: none; }
      canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; }
      #sound { position: fixed; top: max(10px, env(safe-area-inset-top)); right: 10px; width: 40px; height: 40px; border: 0; border-radius: 20px;
        background: rgba(0,0,0,0.25); color: #fff; font: 18px system-ui, sans-serif; cursor: pointer; }
      #debug { position: fixed; left: 8px; bottom: 8px; padding: 8px; background: rgba(0,0,0,0.65); color: #fff; font: 12px ui-monospace, monospace;
        border-radius: 6px; display: none; }
      #debug button { font: inherit; margin: 4px 4px 0 0; }
      #share { position: fixed; left: 50%; top: 60%; transform: translateX(-50%); display: none; padding: 12px 22px; border: 0;
        border-radius: 24px; background: #ffe9a8; color: #1a2433; font: 600 16px system-ui, sans-serif; cursor: pointer; }
      #toast { position: fixed; left: 50%; top: 16%; transform: translateX(-50%); padding: 8px 14px; border-radius: 16px;
        background: rgba(0,0,0,0.7); color: #fff; font: 14px system-ui, sans-serif; opacity: 0; transition: opacity .2s; pointer-events: none;
        max-width: 80vw; text-align: center; }
      #toast.show { opacity: 1; }
      #mapnote { position: fixed; left: 50%; top: 10%; transform: translateX(-50%); display: none; padding: 10px 12px 10px 16px;
        border-radius: 14px; background: rgba(10,16,26,0.85); color: #fff; font: 13px system-ui, sans-serif; max-width: min(86vw, 380px);
        align-items: center; gap: 10px; }
      #mapnote button { border: 0; border-radius: 12px; padding: 6px 12px; background: #ffe9a8; color: #1a2433; font: 600 13px system-ui, sans-serif; }
      #privacy { position: fixed; right: 8px; bottom: 6px; color: rgba(255,255,255,0.45); font: 11px system-ui, sans-serif; display: none; }
    </style>
  </head>
  <body>
    <canvas id="game" aria-label="Driftline: hold the left or right side to steer"></canvas>
    <button id="sound" aria-label="Toggle sound">♪</button>
    <button id="share">Challenge a friend</button>
    <div id="toast" role="status" aria-live="polite"></div>
    <div id="mapnote" role="note"><span>Your river map is kept in this browser. Clearing site data erases it.</span><button>OK</button></div>
    <div id="privacy">Anonymous gameplay stats. No personal data.</div>
    <div id="debug"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
